<div class="form-container">
  <h2>הוספת שאלה חדשה</h2>
  <form (ngSubmit)="onSubmit()" #questionForm="ngForm">
    <div class="form-group">
      <label for="category">קטגוריה:</label>
      <select id="category" [(ngModel)]="newQuestion.category" name="category" required>
        <option value="angular">Angular</option>
        <option value="csharp">C#</option>
        <option value="sql">SQL</option>
        <option value="algorithm">Algorithm</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">Javascript</option>
      </select>
    </div>

    <div class="form-group">
      <label for="question">שאלה:</label>
      <textarea id="question" [(ngModel)]="newQuestion.question" name="question" required rows="3"></textarea>
    </div>

    <div class="options-container">
      <h3>אפשרויות תשובה:</h3>
      @for(option of newQuestion.options; track option.indexOf; let i = $index) {
      <div class="form-group">
        <label [for]="'option' + i">אפשרות {{ i + 1 }}:</label>
        <div class="option-input">
          <input [id]="'option' + i" [(ngModel)]="newQuestion.options[i]" [name]="'option' + i" required />
          <input type="radio" [id]="'correct' + i" name="correctAnswer" [value]="i"
            [(ngModel)]="newQuestion.correctAnswer" required />
          <label [for]="'correct' + i" class="radio-label">תשובה נכונה</label>
        </div>
      </div>
      }
    </div>

    <div class="form-group">
      <label for="explain">הסבר תשובה:</label>
      <textarea id="explain" [(ngModel)]="newQuestion.explain" name="explain" rows="3"></textarea>
    </div>

    <div class="button-container">
      <button type="submit" [disabled]="!questionForm.form.valid">הוסף שאלה</button>
    </div>
  </form>
  @if(showSuccess){
  <div class="success-message">
    השאלה נוספה בהצלחה!
  </div>
  }
</div>
